# Shared backing services for the project

name: ai-triad

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: bash -c "bash scripts/dev-bootstrap.sh && sleep infinity"
    volumes:
      - .:/workspaces/ai-triad-research:cached
      - ../ai-triad-data/:/workspaces/ai-triad-data:cached
      - pnpm-store:/pnpm/store
    ports:
      - "5173:5173"
      - "5174:5174"
      - "5175:5175"
      - "7862:7862"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-aitriad2026}
      AUTH_DISABLED: "1"
    depends_on:
      neo4j:
        condition: service_started
        required: false

  neo4j:
    image: neo4j:community
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-aitriad2026}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pnpm-store:
  neo4j-data:
  neo4j-logs:
